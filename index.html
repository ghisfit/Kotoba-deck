<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2c4a8c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<style>body{margin:0}[hidden]{display:none!important}:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}</style>
<title>Kotoba Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
/* Layout: one-screen study app. Slim top bar with tabs, one large card in the middle, answer row pinned under it. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#172033; --muted:#5d6880; --line:#d5dbe6;
  --accent:#2c4a8c; --accent-ink:#ffffff; --seal:#b3352b;
  --again:#b3352b; --hard:#9a6a08; --good:#23774a; --easy:#2c4a8c;
  --new:#2c64c4; --learn:#b3352b; --rev:#23774a;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141d; --surface:#1a2130; --ink:#e8ecf5; --muted:#98a3ba; --line:#2d3649;
  --accent:#8fb0f2; --accent-ink:#0e1420; --seal:#e8695d;
  --again:#f08277; --hard:#e0b04a; --good:#62c690; --easy:#8fb0f2;
  --new:#7fa8f5; --learn:#f08277; --rev:#62c690; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141d; --surface:#1a2130; --ink:#e8ecf5; --muted:#98a3ba; --line:#2d3649;
  --accent:#8fb0f2; --accent-ink:#0e1420; --seal:#e8695d;
  --again:#f08277; --hard:#e0b04a; --good:#62c690; --easy:#8fb0f2;
  --new:#7fa8f5; --learn:#f08277; --rev:#62c690; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:12px 16px;height:100%;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.counts{display:flex;gap:14px;justify-content:center;font-variant-numeric:tabular-nums;font-weight:600}
.counts span{display:flex;gap:5px;align-items:baseline}
.counts small{font-weight:400;color:var(--muted);font-size:12px}
.c-new{color:var(--new)}.c-learn{color:var(--learn)}.c-rev{color:var(--rev)}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:auto}
.card{position:relative;flex:1;min-height:240px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 20px;text-align:center}
.seal{position:absolute;top:14px;right:14px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-weight:700;font-size:13px;padding:2px 6px;border-radius:3px;transform:rotate(4deg)}
.word{font-family:var(--display);font-weight:500;font-size:clamp(40px,13vw,72px);line-height:1.15;overflow-wrap:anywhere}
.kana{font-family:var(--display);font-size:22px}
.romaji{color:var(--muted);font-size:17px;letter-spacing:.03em}
.rule{width:56px;height:1px;background:var(--line);margin:6px 0}
.meaning{font-size:21px;font-weight:500;max-width:30ch;text-wrap:balance}
.say{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted);font-size:13px}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.answers button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.answers small{font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.a1{color:var(--again)}.a2{color:var(--hard)}.a3{color:var(--good)}.a4{color:var(--easy)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:13px;font-weight:600;width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:8px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row p{margin:0;color:var(--muted);font-size:13px}
.row>div{min-width:0;flex:1 1 200px}
input[type=number],input[type=text],input[type=search]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input[type=number]{width:90px}
.lv{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.fc{display:flex;align-items:flex-end;gap:4px;height:90px}
.fc div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.fc i{display:block;width:100%;background:var(--rev);border-radius:2px 2px 0 0;min-height:1px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.item b{font-family:var(--display);font-size:18px;font-weight:500}
.item span{color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.item em{font-style:normal;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add input:nth-child(3),.add button{grid-column:1/-1}
.danger{color:var(--again);border-color:var(--again)}
.done{font-family:var(--display);font-size:26px}
@media (max-width:420px){.brand{font-size:18px}.tabs button{padding:6px 8px}}
</style>
</head><body>
<div class="app">
  <div class="top">
    <div class="brand">Kotoba Deck</div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="study">Study</button>
      <button role="tab" data-t="deck">Deck</button>
      <button role="tab" data-t="stats">Stats</button>
      <button role="tab" data-t="settings">Settings</button>
    </div>
  </div>
  <main id="main"></main>
  <div class="foot"><span id="sync">Loading your progress…</span><button id="undo" hidden>Undo last answer</button></div>
</div>

const KM={};(()=>{const t="あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo ゔvu ぁa ぃi ぅu ぇe ぉo";

const y={"ゃ":"a","ゅ":"u","ょ":"o","ぇ":"e"};
for(const k of "きしちにひみりぎじぢびぴ"){const b=KM[k];for(const s in y){KM[k+s]=(/^(sh|ch|j)/.test(b)?b.slice(0,-1):b.slice(0,-1)+"y")+y[s]}}
Object.assign(KM,{"ふぁ":"fa","ふぃ":"fi","ふぇ":"fe","ふぉ":"fo","てぃ":"ti","でぃ":"di","うぃ":"wi","うぇ":"we","うぉ":"wo","ゔぁ":"va","ゔぃ":"vi","ゔぇ":"ve","ゔぉ":"vo","とぅ":"tu","どぅ":"du","でゅ":"dyu"});})();
function romaji(k){
  let h="";for(const ch of k){const c=ch.charCodeAt(0);h+=(c>=0x30a1&&c<=0x30f6)?String.fromCharCode(c-0x60):ch}
  let o="",dbl=false;
  for(let i=0;i<h.length;i++){
    const two=h.substr(i,2),c=h[i];let r;
    if(c==="っ"){dbl=true;continue}
    if(c==="ー"){const l=o.slice(-1);if("aiueo".includes(l))o+=l;continue}
    if(c==="ん"){const n=KM[h.substr(i+1,2)]||KM[h[i+1]]||"";o+=/^[aiueoy]/.test(n)?"n'":"n";continue}
    if(KM[two]){r=KM[two];i++}else r=KM[c]??c;
    if(dbl){r=(r[0]==="c"?"t":r[0])+r;dbl=false}
    o+=r;
  }
  return o;
}

/* ---------- storage: account (db) with a device copy as backup ---------- */
const dirty=new Set();let busy=false,timer=0;
function bucketBody(n){const b=+n.slice(1),c={};for(let i=b*BK;i<(b+1)*BK;i++)if(S.cards[i])c[i]=S.cards[i];return{c}}
function mark(i){dirty.add("b"+Math.floor(i/BK));dirty.add("meta");save()}
function save(){
  try{localStorage.setItem("kotoba",JSON.stringify(S))}catch(e){}
  clearTimeout(timer);timer=setTimeout(flush,700);
}
async function flush(){
  if(busy||!base)return;busy=true;
  while(dirty.size){
    const n=dirty.values().next().value;dirty.delete(n);
    const body=n==="meta"?JSON.parse(JSON.stringify(S.meta)):bucketBody(n);
    try{await base.doc(n).set(body)}
    catch(e){
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,1500+Math.random()*1500));try{await base.doc(n).set(body)}catch(e2){dirty.add(n);setSync("Could not reach your account. Progress is kept on this device and will retry on your next answer.");break}}
      else{base=null;setSync("Saving to your account is not available here. Progress is kept on this device only.");break}
    }
  }
  busy=false;
}
function setSync(m){syncMsg=m;$("#sync").textContent=m}
function adopt(o){if(!o)return false;if(o.meta){Object.assign(S.meta,o.meta);S.meta.set=Object.assign({nd:30,rom:true,auto:false},o.meta.set)}if(o.cards)S.cards=o.cards;return true}
async function load(){
  let local=null;try{local=JSON.parse(localStorage.getItem("kotoba")||"null")}catch(e){}
  let ok=false;
  try{
    const [db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);
    const uid=user?await user.id():null;
    if(db&&uid){
      base=db.collection("data/users/"+uid);
      const snap=await base.limit(1000).get();
      if(!snap.empty){
        const cards={};let meta=null;
        snap.docs.forEach(d=>{const x=d.data();if(d.id==="meta")meta=x;else if(x&&x.c)for(const k in x.c)cards[k]=[...x.c[k]]});
        adopt({meta:meta&&JSON.parse(JSON.stringify(meta)),cards});
      }else if(adopt(local)){Object.keys(S.cards).forEach(i=>dirty.add("b"+Math.floor(i/BK)));dirty.add("meta")}
      ok=true;setSync("Progress saves to your account and follows you across devices.");
    }
  }catch(e){base=null}
  if(!ok){adopt(local);setSync("Progress is saved on this device only.")}
  rebuild();rollDay();if(!shown)cur=null;render();if(dirty.size)flush();
}

/* ---------- scheduler (Anki-style SM-2) ---------- */
function sched(c,g,now,fz){
  let [s,due,ivl,ease,step,laps]=c||[0,0,0,250,0,0];const today=dayNum(now);
  if(s===2){
    const late=Math.max(0,today-due);let ni;
    if(g===1)return[3,now+10*MIN,1,Math.max(130,ease-20),0,laps+1];
    if(g===2){ni=Math.max(ivl+1,ivl*1.2);ease=Math.max(130,ease-15)}
    else if(g===3)ni=Math.max(ivl+1,(ivl+late/2)*ease/100);
    else{ni=Math.max(ivl+1,(ivl+late)*ease/100*1.3);ease+=15}
    if(fz&&ni>=3)ni*=0.95+Math.random()*0.1;
    ni=Math.min(36500,Math.round(ni));return[2,today+ni,ni,ease,0,laps];
  }
  const steps=s===3?[10]:[1,10],ls=s||1;
  if(g===1)return[ls,now+steps[0]*MIN,ivl,ease,0,laps];
  if(g===2){const d=(step===0&&steps.length>1)?(steps[0]+steps[1])/2:steps[step];return[ls,now+d*MIN,ivl,ease,step,laps]}
  if(g===3&&step+1<steps.length)return[ls,now+steps[step+1]*MIN,ivl,ease,step+1,laps];
  const ni=g===4?(s===3?Math.max(1,ivl)+1:4):(s===3?Math.max(1,ivl):1);
  return[2,today+ni,ni,ease,0,laps];
}
function label(n,now){
  if(n[0]!==2){const m=Math.round((n[1]-now)/MIN);return m<1?"<1 min":m+" min"}
  const d=n[2];return d<30?d+(d===1?" day":" days"):d<365?(d/30).toFixed(1)+" mo":(d/365).toFixed(1)+" yr";
}
function queue(){
  rollDay();const now=Date.now(),today=dayNum(now),L=[],Ls=[],R=[];let firstNew=-1,nNew=0;
  for(const i of IDS){const c=S.cards[i];
    if(!c){if(firstNew<0)firstNew=i;nNew++}
    else if(c[0]===2){if(c[1]<=today)R.push(i)}
    else(c[1]<=now?L:Ls).push(i)}
  const d=S.meta.day,newLeft=Math.max(0,Math.min(S.meta.set.nd+d.extra-d.nw,nNew));
  const early=a=>a.reduce((m,i)=>S.cards[i][1]<S.cards[m][1]?i:m,a[0]);
  let pick=null;
  if(L.length)pick=early(L);
  else if(R.length+newLeft)pick=Math.random()*(R.length+newLeft)<newLeft?firstNew:R[Math.floor(Math.random()*R.length)];
  else if(Ls.length)pick=early(Ls);
  return{pick,newLeft,learn:L.length+Ls.length,rev:R.length,nNew};
}
function answer(g){
  if(cur==null)return;const i=cur,c=S.cards[i],now=Date.now(),d=S.meta.day,t=dayNum(now);
  undo={i,c:c?[...c]:null,day:{...d},h:S.meta.hist[t]||0};
  S.cards[i]=sched(c,g,now,true);
  if(!c)d.nw++;else if(c[0]===2)d.rev++;
  S.meta.hist[t]=(S.meta.hist[t]||0)+1;
  for(const k in S.meta.hist)if(+k<t-180)delete S.meta.hist[k];
  cur=null;shown=false;mark(i);render();
}
function doUndo(){
  if(!undo)return;const{i,c,day,h}=undo;
  if(c)S.cards[i]=c;else delete S.cards[i];
  S.meta.day=day;S.meta.hist[day.d]=h;undo=null;cur=i;shown=false;mark(i);render();
}
let jaVoice=null;
function findVoice(){try{const v=speechSynthesis.getVoices();jaVoice=v.find(x=>/^ja/i.test(x.lang)&&x.localService)||v.find(x=>/^ja/i.test(x.lang))||null;return v.length}catch(e){return 0}}
try{findVoice();speechSynthesis.addEventListener("voiceschanged",findVoice)}catch(e){}
function speak(t){
  try{
    const n=findVoice();
    if(n&&!jaVoice){setSync("No Japanese voice is installed on this device, so audio cannot play. Add one in the device's text-to-speech settings.");return}
    const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.9;u.volume=1;if(jaVoice)u.voice=jaVoice;
    let started=false;u.onstart=()=>{started=true};
    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")setSync("Audio was blocked here ("+e.error+"). Try opening the page in your phone or computer browser.")};
    speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u);
    setTimeout(()=>{if(!started&&!speechSynthesis.speaking)setSync("Audio did not start. This view may not allow speech; try opening the page in a browser, and check the device is not on silent.")},2500);
  }catch(e){setSync("Audio is not available in this view.")}
}
const canSpeak="speechSynthesis"in window;

/* ---------- views ---------- */
function vStudy(){
  const Q=queue();if(cur==null)cur=Q.pick;
  const counts=`<div class="counts"><span class="c-new">${Q.newLeft}<small>new</small></span><span class="c-learn">${Q.learn}<small>learning</small></span><span class="c-rev">${Q.rev}<small>to review</small></span></div>`;
  if(cur==null){
    const more=Q.nNew?`<button class="primary" data-a="more">Learn 20 more new cards</button>`:"";
    return counts+`<div class="card"><div class="done">Done for today</div><p class="romaji">Otsukaresama. Every card that was due has been reviewed.</p></div>${more}`;
  }
  const [e,k,m,lv]=card(cur),now=Date.now(),c=S.cards[cur],ro=romaji(k);
  const seal=`<div class="seal">${lv?"N"+lv:"Mine"}</div>`;
  if(!shown)return counts+`<div class="card">${seal}<div class="word" lang="ja">${esc(e)}</div>${S.meta.set.rom?`<div class="romaji">${esc(ro)}</div>`:""}</div><button class="primary" data-a="show">Show answer</button>`;
  const b=[1,2,3,4].map(g=>`<button class="a${g}" data-g="${g}">${["Again","Hard","Good","Easy"][g-1]}<small>${label(sched(c,g,now,false),now)}</small></button>`).join("");
  return counts+`<div class="card">${seal}<div class="word" lang="ja">${esc(e)}</div>${e!==k?`<div class="kana" lang="ja">${esc(k)}</div>`:""}<div class="romaji">${esc(ro)}</div><div class="rule"></div><div class="meaning">${esc(m)}</div>${canSpeak?`<button class="say" data-a="say">Play audio</button>`:""}</div><div class="answers">${b}</div>`;
}
function statusOf(i,today){const c=S.cards[i];if(!c)return"New";if(c[0]!==2)return"Learning";const d=c[1]-today;return d<=0?"Due":"In "+(d<30?d+"d":d<365?(d/30).toFixed(1)+"mo":(d/365).toFixed(1)+"y")}
function vDeck(){
  return`<div class="panel"><h2>Search ${IDS.length.toLocaleString()} cards</h2><input type="search" id="q" placeholder="Japanese, romaji or English" value="${esc(q)}"><div class="list" id="res"></div></div>
  <div class="panel"><h2>Add your own card</h2><form class="add" id="add"><input type="text" id="ae" placeholder="Word (kanji or kana)" required><input type="text" id="ak" placeholder="Reading in kana" required><input type="text" id="am" placeholder="Meaning" required><button class="ghost">Add card</button></form></div>`;
}
function fillRes(){
  const el=$("#res");if(!el)return;const t=q.trim().toLowerCase(),today=dayNum(Date.now()),out=[];
  for(const i of IDS){const[e,k,m]=card(i);if(!t||e.includes(t)||k.includes(t)||m.toLowerCase().includes(t)||romaji(k).includes(t)){out.push(`<div class="item"><b lang="ja">${esc(e)}</b><em>${statusOf(i,today)}</em><span>${esc(romaji(k))} · ${esc(m)}</span></div>`);if(out.length>=60)break}}
  el.innerHTML=out.join("")||`<div class="item"><span>No card matches that search.</span></div>`;
}
function vStats(){
  const today=dayNum(Date.now()),L={5:[0,0,0,0],4:[0,0,0,0],3:[0,0,0,0],0:[0,0,0,0]},fc=Array(14).fill(0);let known=0;
  for(const i of IDS){const lv=card(i)[3],c=S.cards[i],a=L[lv];
    if(!c)a[0]++;else if(c[0]!==2){a[1]++;fc[0]++}else{a[c[2]<21?2:3]++;known++;const d=Math.max(0,c[1]-today);if(d<14)fc[d]++}}
  let streak=0;for(let d=today;S.meta.hist[d];d--)streak++;if(!streak)for(let d=today-1;S.meta.hist[d];d--)streak++;
  const cols=["var(--line)","var(--learn)","var(--good)","var(--accent)"];
  const rows=[5,4,3,0].filter(l=>l||S.meta.custom.length).map(l=>{const a=L[l],n=a[0]+a[1]+a[2]+a[3]||1;
    return`<div class="lv"><b>${l?"N"+l:"Mine"}</b><div class="bar">${a.map((v,j)=>`<i style="width:${v/n*100}%;background:${cols[j]}"></i>`).join("")}</div><span>${a[2]+a[3]} / ${n}</span></div>`}).join("");
  const mx=Math.max(1,...fc);
  return`<div class="panel"><div class="big"><div><b>${S.meta.hist[today]||0}</b><span>answers today</span></div><div><b>${streak}</b><span>day streak</span></div><div><b>${known}</b><span>words learned</span></div></div></div>
  <div class="panel"><h2>Progress by level</h2>${rows}<div class="legend"><span><i style="background:${cols[0]}"></i>New</span><span><i style="background:${cols[1]}"></i>Learning</span><span><i style="background:${cols[2]}"></i>Young</span><span><i style="background:${cols[3]}"></i>Mature (21+ days)</span></div></div>
  <div class="panel"><h2>Reviews due, next 14 days</h2><div class="fc">${fc.map((v,d)=>`<div>${v||""}<i style="height:${v/mx*70}%"></i><span>${d?"+"+d:"Now"}</span></div>`).join("")}</div></div>`;
}
function vSettings(){
  const s=S.meta.set;
  return`<div class="panel"><h2>Study</h2>
  <div class="row"><div><b>New cards per day</b><p>Raise it to move fast while the words are easy. Reviews are never capped.</p></div><input type="number" id="nd" min="0" max="500" value="${s.nd}"></div>
  <div class="row"><div><b>Show romaji on the front</b><p>Turn off once you want to test the reading as well as the meaning.</p></div><input type="checkbox" id="rom" ${s.rom?"checked":""}></div>
  ${canSpeak?`<div class="row"><div><b>Play audio when the answer shows</b><p>Uses your device's Japanese voice.</p></div><input type="checkbox" id="auto" ${s.auto?"checked":""}></div>`:""}</div>
  <div class="panel"><h2>How the timing works</h2><p style="margin:0;color:var(--muted)">New cards repeat after 1 and 10 minutes, then move to 1 day. Good multiplies the gap by about 2.5 each time. Easy on a new card skips straight to 4 days. Again brings a card back in 10 minutes and makes it come up more often from then on.</p></div>
  <div class="panel"><h2>Backup</h2><div class="row"><div><p>Progress lives on this device. Export a file to keep a copy or move to another device.</p></div><button class="ghost" data-a="export">Export</button><label class="ghost" style="cursor:pointer">Import<input type="file" id="imp" accept="application/json,.json" hidden></label></div></div>
  <div class="panel"><h2>Reset</h2><div class="row"><div><p>${resetArm?"This erases every interval and your history. Press again to confirm.":"Start the whole deck again from zero."}</p></div><button class="ghost danger" data-a="reset">${resetArm?"Erase all progress":"Reset progress"}</button></div></div>`;
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
  $("#main").innerHTML={study:vStudy,deck:vDeck,stats:vStats,settings:vSettings}[tab]();
  $("#undo").hidden=!(undo&&tab==="study");
  if(tab==="deck")fillRes();
}
function reveal(){shown=true;render();if(S.meta.set.auto&&cur!=null)speak(card(cur)[1])}

/* ---------- events ---------- */
$("#tabs").addEventListener("click",e=>{const t=e.target.dataset.t;if(t){tab=t;resetArm=false;render()}});
$("#undo").addEventListener("click",doUndo);
$("#main").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.g)return answer(+b.dataset.g);
  const a=b.dataset.a;
  if(a==="show")reveal();
  else if(a==="say")speak(card(cur)[1]);
  else if(a==="more"){S.meta.day.extra+=20;dirty.add("meta");save();render()}
  else if(a==="export"){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="kotoba-deck-backup.json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
  else if(a==="reset"){
    if(!resetArm){resetArm=true;return render()}
    Object.keys(S.cards).forEach(i=>dirty.add("b"+Math.floor(i/BK)));S.cards={};S.meta.hist={};S.meta.day={d:0,nw:0,extra:0,rev:0};undo=null;cur=null;shown=false;resetArm=false;dirty.add("meta");save();render();
  }
});
$("#main").addEventListener("input",e=>{
  const t=e.target,s=S.meta.set;
  if(t.id==="q"){q=t.value;fillRes();return}
  if(t.id==="nd")s.nd=Math.max(0,Math.min(500,parseInt(t.value)||0));
  else if(t.id==="rom")s.rom=t.checked;
  else if(t.id==="auto")s.auto=t.checked;
  else return;
  dirty.add("meta");save();
});
$("#main").addEventListener("change",e=>{
  if(e.target.id!=="imp"||!e.target.files[0])return;
  const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.meta||!o.cards)throw 0;adopt(o);rebuild();cur=null;shown=false;undo=null;save();render();setSync("Backup imported.")}catch(x){setSync("That file is not a Kotoba Deck backup.")}};r.readAsText(e.target.files[0]);
});
$("#main").addEventListener("submit",e=>{
  e.preventDefault();if(e.target.id!=="add")return;
  const v=["ae","ak","am"].map(i=>$("#"+i).value.trim());if(v.some(x=>!x))return;
  S.meta.custom.push(v);rebuild();dirty.add("meta");save();q=v[0];render();
});
document.addEventListener("keydown",e=>{
  if(tab!=="study"||/INPUT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey)return;
  if(!shown&&cur!=null&&(e.key===" "||e.key==="Enter")){e.preventDefault();reveal()}
  else if(shown&&"1234".includes(e.key))answer(+e.key);
  else if(shown&&e.key===" "){e.preventDefault();answer(3)}
  else if(e.key==="z")doUndo();
});
rebuild();rollDay();render();load();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
